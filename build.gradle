import io.github.brainage04.minecraftmodconventions.gradle.quality.DeprecatedGameTestApiCheck
import io.github.brainage04.minecraftmodconventions.gradle.quality.VanillaIdentityCheck
import io.github.brainage04.minecraftmodconventions.gradle.quality.VanillaTagIdentitiesCheck
import io.github.brainage04.minecraftmodconventions.gradle.quality.WorldHeightCheck

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'io.github.brainage04.java-quality-conventions' version "${minecraftmodconventions_version}"
	id 'info.solidsoft.pitest' version '1.19.0'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom / Minecraft / Fabric
	mavenCentral()
	maven { url = "https://libraries.minecraft.net" }
	maven { url = "https://maven.fabricmc.net/" }

	// DevAuth
	maven { url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }

	// Baritone publishes its Fabric jars only as GitHub release assets.
	exclusiveContent {
		forRepository {
			ivy {
				name = "Baritone releases"
				url = "https://github.com/cabaletta/baritone/releases/download/"
				patternLayout { artifact "v[revision]/[module]-[revision].[ext]" }
				metadataSources { artifact() }
			}
		}
		filter { includeGroup "cabaletta" }
	}

	// Baritone's own dependency, nested in its jar; Loom strips nested jars from development dependencies.
	exclusiveContent {
		forRepository {
			maven {
				name = "babbaj"
				url = "https://babbaj.github.io/maven/"
			}
		}
		filter { includeGroup "dev.babbaj" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	// jqwik 1.10.2 is built on JUnit Platform 1.14, so the JUnit modules follow the same release line.
	testImplementation platform('org.junit:junit-bom:5.14.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'net.jqwik:jqwik:1.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// DevAuth
	modRuntimeOnly("me.djtheredstoner:DevAuth-fabric:1.2.2")

	// Walks the player to a bed out of reach; shipped inside the mod's jar, nether-pathfinder included.
	modImplementation "cabaletta:baritone-api-fabric:${project.baritone_version}"
	include "cabaletta:baritone-api-fabric:${project.baritone_version}"
	modRuntimeOnly "dev.babbaj:nether-pathfinder:${project.nether_pathfinder_version}"
}

processResources {
	inputs.property "mod_id", project.properties.mod_id
	inputs.property "mod_version", project.version
	inputs.property "mod_name", project.properties.mod_name
	inputs.property "loader_version", project.properties.loader_version
	inputs.property "minecraft_version", project.properties.minecraft_version

	filesMatching("fabric.mod.json") {
	expand([
				"mod_id": inputs.properties.mod_id,
				"mod_version": inputs.properties.mod_version,
				"mod_name": inputs.properties.mod_name,
				"loader_version": inputs.properties.loader_version,
				"minecraft_version": inputs.properties.minecraft_version,
		])
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		autosleep {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		matching { it.name == "clientGameTest" }.configureEach {
			// A 1080p window, so client GameTest recordings fill a 1920x1080 screen as the other mods' do. At GUI
			// scale 3 that is 640x360 GUI pixels: the same overlay size these recordings have always had at 1280x720
			// and scale 2, only sharper.
			programArgs "--width", "1920", "--height", "1080"
			// A host whose DevAuth config enables it would otherwise wait forever for a Microsoft login.
			vmArg "-Ddevauth.enabled=false"
			// A take on the GPU display fails unless the client draws with the card: a silent fallback to software
			// rendering would be a slow recording that looks like a GPU one.
			vmArg "-Dautosleep.requireNvidia=" + (providers.gradleProperty("autosleepRequireNvidia").getOrElse("false"))
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "${project.mod_id}-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// Film-only code (the recording HUDs, the bed framing checks, the take's renderer check) goes in src/recording, laid
// out as MinecraftModConventions lays it out for 26.3 mods (ProductionGameTestsPlugin#registerRecordingSourceSet in
// 3.4.0, which only its production-gametests plugin registers): the film compiles against what a GameTest compiles
// against, the GameTests compile against the film, and the film loads as part of the GameTest mod.
def gametestSourceSet = sourceSets.gametest
sourceSets {
	recording {
		compileClasspath = files(configurations.getByName(gametestSourceSet.compileClasspathConfigurationName), gametestSourceSet.compileClasspath)
	}
}
loom.mods.named("${project.mod_id}-gametest") {
	sourceSet sourceSets.recording
}
tasks.named(gametestSourceSet.compileJavaTaskName, JavaCompile) {
	classpath += files(sourceSets.recording.java.classesDirectory)
	dependsOn(tasks.named(sourceSets.recording.classesTaskName))
}
dependencies {
	gametestRuntimeOnly files(sourceSets.recording.output)
}

// The source checks MinecraftModConventions' fabric-mod-conventions plugin registers on its mods. That plugin applies
// the non-remapping Loom (FabricModConventionsPlugin.java:46 in 3.4.0), which cannot build 1.21.11; the checks only read
// sources and the Minecraft jars.
VanillaIdentityCheck.register(project)
VanillaTagIdentitiesCheck.register(project, loom.namedMinecraftJars)
WorldHeightCheck.register(project)
DeprecatedGameTestApiCheck.register(project)

tasks.named("processGametestResources") {
	inputs.property "mod_id", project.properties.mod_id
	inputs.property "mod_version", project.version
	inputs.property "mod_name", project.properties.mod_name

	filesMatching("fabric.mod.json") {
		expand([
				"mod_id": inputs.properties.mod_id,
				"mod_version": inputs.properties.mod_version,
				"mod_name": inputs.properties.mod_name,
		])
	}
}

def clientGameTestRunDir = layout.buildDirectory.dir("run/clientGameTest")
// GUI scale 3 at 1920x1080 is the same 640x360 GUI as scale 2 at 1280x720; the sound device is the recorder's sink.
def recordingGuiScale = providers.gradleProperty("autosleepGuiScale").orElse("3")
def recordingSoundDevice = providers.gradleProperty("autosleepSoundDevice").orElse("")

// BEGIN CLIENT GAMETEST RUN SETUP
tasks.register("prepareClientGameTestRun") {
	def optionsFile = clientGameTestRunDir.map { it.file("options.txt") }

	outputs.file(optionsFile)
	mustRunAfter(tasks.named("deleteGameTestRunDir"))
	inputs.property("guiScale", recordingGuiScale)
	inputs.property("soundDevice", recordingSoundDevice)

	doLast {
		def settings = [
				version              : "4671",
				ao                   : "false",
				autoJump             : "false",
				biomeBlendRadius     : "0",
				chunkSectionFadeInTime : "0.0",
				enableVsync            : "false",
				entityDistanceScaling  : "0.5",
				entityShadows          : "false",
				fullscreen             : "false",
				graphicsPreset         : '"fast"',
				guiScale               : recordingGuiScale.get(),
				improvedTransparency   : "false",
				joinedFirstServer      : "true",
				maxAnisotropyBit       : "1",
				maxFps                 : "30",
				menuBackgroundBlurriness: "0",
				mipmapLevels           : "0",
				narrator               : "0",
				narratorHotkey         : "false",
				particles              : "2",
				prioritizeChunkUpdates : "0",
				renderClouds           : '"false"',
				renderDistance         : "5",
				simulationDistance     : "5",
				soundDevice            : recordingSoundDevice.get(),
				soundCategory_master   : recordingSoundDevice.get().isEmpty() ? "0.0" : "1.0",
				soundCategory_music    : "0.0",
				toggleSprint           : "true",
				weatherRadius         : "5"
		]
		def file = optionsFile.get().asFile

		file.parentFile.mkdirs()
		file.text = settings.collect { key, value -> "${key}:${value}" }.join(System.lineSeparator()) + System.lineSeparator()
	}
}

tasks.matching { it.name == "runClientGameTest" }.configureEach {
	dependsOn(tasks.named("prepareClientGameTestRun"))
}
// END CLIENT GAMETEST RUN SETUP

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	// The LGPL text and the notice cover the Baritone jar nested in this one.
	from(files("LICENSE", "NOTICE", "COPYING", "COPYING.LESSER")) {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

test {
	useJUnitPlatform {
		excludeEngines 'jqwik'
	}
	systemProperty "fabric.side", "client"
}

// The jqwik tests run on their own, outside the Fabric loader: inside it jqwik finds no @Property methods (MagicCarpet's
// CarpetMotionTest ran 6 of its 10 tests there, 14 Nov 2026), and they need no loader. The other unit tests need it.
def propertyTest = tasks.register('propertyTest', Test) {
	description = 'Runs the jqwik tests without the Fabric loader.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath.filter { !it.name.startsWith('fabric-loader-junit') }
	useJUnitPlatform {
		includeEngines 'jqwik'
	}
}
tasks.named('check') {
	dependsOn propertyTest
}

pitest {
	pitestVersion = '1.30.2'
	junit5PluginVersion = '1.2.3'
	mainSourceSets = [sourceSets.main, sourceSets.client]
	targetClasses = ['io.github.brainage04.autosleep.FailedTries', 'io.github.brainage04.autosleep.Clock']
	targetTests = ['io.github.brainage04.autosleep.FailedTriesTest', 'io.github.brainage04.autosleep.ClockTest']
	threads = 1
	timeoutConstInMillis = 5000
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
}
tasks.named('pitest') {
	// With fabric-loader-junit on the classpath PIT records no coverage (SimpleTwitchChat measured 0 of 90 lines).
	def classpath = files(additionalClasspath.from.toList())
	additionalClasspath.setFrom(classpath.filter { !it.name.startsWith('fabric-loader-junit') })
}
