name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # The strict build and the client GameTests, exactly as on every push, with a read-only token;
  # nothing is published unless both pass.
  verify:
    uses: ./.github/workflows/build.yml
    with:
      require_client_gametests: true

  # Publishes the jar the verify job built. It runs no build code, so its write token never meets
  # third-party plugins or dependencies.
  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: verify tag matches mod version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "v${VERSION}" != "${TAG_NAME}" ]; then
            echo "Expected tag v${VERSION}, got ${TAG_NAME}"
            exit 1
          fi

      - name: download the verified build
        uses: actions/download-artifact@v7
        with:
          name: Artifacts
          path: build/libs

      - name: collect release artifacts
        run: |
          mkdir -p release-artifacts
          cp build/libs/*.jar release-artifacts/
          rm -f release-artifacts/*-dev.jar

      - name: read release notes from tag annotation
        id: notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          NOTES="$(git tag -l --format='%(contents)' "${TAG_NAME}")"

          {
            echo 'body<<EOF'
            printf '%s\n' "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*.jar
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: ${{ steps.notes.outputs.body == '' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
